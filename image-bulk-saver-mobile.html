<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>画像一括保存</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;font-family:system-ui;color:#111827;padding-bottom:75px}header{position:sticky;top:0;z-index:2;background:#111827;color:white;padding:12px}h1{font-size:18px;margin:0 0 8px}.search{display:flex;gap:6px}.search input{flex:1;min-width:0;padding:12px;border:0;border-radius:10px;font-size:16px}.search button{border:0;border-radius:10px;padding:0 15px;font-weight:700}.wrap{padding:12px}.info{font-size:13px;color:#6b7280;margin-bottom:10px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.card{position:relative;background:#fff;border-radius:10px;overflow:hidden}.card.selected{outline:3px solid #2563eb}.card img{width:100%;aspect-ratio:1;object-fit:cover;display:block}.check{position:absolute;top:6px;left:6px;width:24px;height:24px;accent-color:#2563eb}.name{font-size:10px;padding:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.status{text-align:center;color:#6b7280;padding:20px}.more{display:block;margin:auto;padding:11px 18px;border:0;border-radius:10px}.bar{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #ddd;padding:8px;display:flex;gap:6px}.bar button{border:0;border-radius:10px;padding:10px;font-weight:700}.save{background:#111827;color:#fff;flex:1}.save:disabled{opacity:.45}@media(min-width:700px){.grid{grid-template-columns:repeat(6,1fr)}}</style></head><body>
<header><h1>🖼️ 画像一括保存</h1><form class="search" id="form"><input id="q" placeholder="画像を検索…"><button>検索</button></form></header>
<main class="wrap"><div id="info" class="info">検索すると画像が表示されます</div><section id="grid" class="grid"></section><div id="status" class="status"></div><button id="more" class="more" hidden>さらに読み込む</button></main>
<div class="bar"><button id="all">全選択</button><button id="clear">解除</button><button id="save" class="save" disabled>⬇ ZIP保存（0）</button></div>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script><script>
let items=[],selected=new Set(),offset=0,q="";const $=x=>document.getElementById(x);
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
async function search(reset=true){q=$("q").value.trim();if(!q)return;if(reset){items=[];selected.clear();offset=0;render()}$("status").textContent="検索中…";$("more").hidden=true;let u=new URL("https://commons.wikimedia.org/w/api.php");u.search=new URLSearchParams({action:"query",generator:"search",gsrsearch:q,gsrnamespace:"6",gsrlimit:"30",gsroffset:offset,prop:"imageinfo",iiprop:"url|size|mime",iiurlwidth:"500",format:"json",origin:"*"});try{let d=await fetch(u).then(r=>r.json());for(let x of Object.values(d.query?.pages||{})){let i=x.imageinfo?.[0];if(i?.thumburl)items.push({id:x.pageid,thumb:i.thumburl,url:i.url,name:x.title.replace(/^File:/,""),mime:i.mime})}offset+=30;render();$("status").textContent="";$("more").hidden=!d.query?.pages||Object.keys(d.query.pages).length<30}catch(e){$("status").textContent="検索に失敗しました"}}
function render(){$("grid").innerHTML="";for(let x of items){let c=document.createElement("article");c.className="card"+(selected.has(x.id)?" selected":"");c.innerHTML=`<img src="${esc(x.thumb)}"><input class="check" type="checkbox" ${selected.has(x.id)?"checked":""}><div class="name">${esc(x.name)}</div>`;let cb=c.querySelector(".check");cb.onchange=()=>{cb.checked?selected.add(x.id):selected.delete(x.id);c.classList.toggle("selected",cb.checked);update()};c.querySelector("img").onclick=()=>open(x.url);$("grid").append(c)}update()}
function update(){$("info").textContent=items.length?`${items.length}枚表示 / ${selected.size}枚選択`:"検索すると画像が表示されます";$("save").disabled=!selected.size;$("save").textContent=`⬇ ZIP保存（${selected.size}）`}
$("form").onsubmit=e=>{e.preventDefault();search(true)};$("more").onclick=()=>search(false);$("all").onclick=()=>{items.forEach(x=>selected.add(x.id));render()};$("clear").onclick=()=>{selected.clear();render()};
$("save").onclick=async()=>{let a=items.filter(x=>selected.has(x.id)),z=new JSZip(),n=0;if(!a.length)return;for(let x of a){try{let r=await fetch(x.url);if(r.ok){let b=await r.blob(),e=(x.mime||"image/jpeg").split("/")[1]||"jpg";if(e==="jpeg")e="jpg";z.file(`${String(++n).padStart(3,"0")}.${e}`,b)}}catch{}}if(!n){alert("取得できない画像がありました");update();return}let b=await z.generateAsync({type:"blob"}),u=URL.createObjectURL(b),l=document.createElement("a");l.href=u;l.download="images.zip";l.click();setTimeout(()=>URL.revokeObjectURL(u),1000);update()};
</script></body></html>
