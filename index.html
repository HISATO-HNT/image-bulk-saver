<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>恋人AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Noto Sans JP", sans-serif;
      background: #f7f2f5;
      color: #333;
    }

    .app {
      max-width: 480px;
      height: 100vh;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      background: #fff;
    }

    .header {
      padding: 16px;
      text-align: center;
      background: #f3dce7;
      border-bottom: 1px solid #eadedc;
    }

    .header .name {
      font-size: 20px;
      font-weight: 700;
    }

    .header .status {
      margin-top: 3px;
      font-size: 12px;
      color: #777;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px 14px;
      background: #fcf9fb;
    }

    .message {
      max-width: 82%;
      margin-bottom: 14px;
      padding: 11px 14px;
      border-radius: 18px;
      line-height: 1.6;
      font-size: 15px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .ai {
      background: #fff;
      border: 1px solid #eee;
      border-top-left-radius: 5px;
      margin-right: auto;
    }

    .user {
      background: #efd1df;
      border-top-right-radius: 5px;
      margin-left: auto;
    }

    .input-area {
      display: flex;
      gap: 8px;
      padding: 10px;
      border-top: 1px solid #eee;
      background: #fff;
    }

    #messageInput {
      flex: 1;
      min-width: 0;
      padding: 12px 14px;
      border: 1px solid #ddd;
      border-radius: 22px;
      font-size: 15px;
      outline: none;
    }

    #sendButton {
      border: none;
      border-radius: 50%;
      width: 46px;
      height: 46px;
      background: #d88eae;
      color: white;
      font-size: 18px;
      cursor: pointer;
    }

    #sendButton:disabled {
      opacity: 0.5;
      cursor: default;
    }

    #sendButton:active {
      transform: scale(0.95);
    }
  </style>
</head>

<body>

  <div class="app">

    <div class="header">
      <div class="name">MAO</div>
      <div class="status">オンライン</div>
    </div>

    <div class="messages" id="messages">
      <div class="message ai">
        おかえりなさい♡<br>
        今日もお疲れさま。どうしたの？
      </div>
    </div>

    <div class="input-area">
      <input
        id="messageInput"
        type="text"
        placeholder="メッセージを入力..."
        autocomplete="off"
      >
      <button id="sendButton" type="button">➤</button>
    </div>

  </div>

  <script>
    const input = document.getElementById("messageInput");
    const button = document.getElementById("sendButton");
    const messages = document.getElementById("messages");

    const API_URL =
      "https://kindroid-proxy.mikawa-hisato.workers.dev";

    function addMessage(text, type) {
      const message = document.createElement("div");

      message.className = "message " + type;
      message.textContent = text;

      messages.appendChild(message);
      messages.scrollTop = messages.scrollHeight;

      return message;
    }

    async function sendMessage() {
      const text = input.value.trim();

      if (!text || button.disabled) {
        return;
      }

      addMessage(text, "user");

      input.value = "";
      button.disabled = true;

      const waitingMessage = addMessage(
        "MAOが返事を考えています…",
        "ai"
      );

      try {
        const response = await fetch(API_URL, {
          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            message: text
          })
        });

        let data;

        try {
          data = await response.json();
        } catch {
          throw new Error(
            "サーバーから正しいJSONが返ってきませんでした"
          );
        }

        if (!response.ok) {
          throw new Error(
            data?.error ||
            data?.details ||
            "HTTP " + response.status
          );
        }

        const reply =
          data?.reply ??
          data?.message ??
          data?.response ??
          data?.text;

        waitingMessage.textContent =
          reply || "うまく返事を受け取れなかったみたい…";

      } catch (error) {
        console.error(error);

        waitingMessage.textContent =
          "ごめん、ちょっと通信でつまずいちゃった🥺";
      } finally {
        button.disabled = false;
        input.focus();
      }
    }

    button.addEventListener("click", sendMessage);

    input.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.isComposing) {
        event.preventDefault();
        sendMessage();
      }
    });
  </script>

</body>
</html>
